[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pekat-vision-sdk"
dynamic = ["version"]
description = "A Python module for communication with PEKAT VISION"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ email = "developers@pekatvision.com" }]
maintainers = [{ email = "developers@pekatvision.com" }]
keywords = ["pekat", "pekatvision", "pekatvisionsdk", "vision", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "requests",
    "packaging",
    "netifaces2",
    "typing-extensions",
    "psutil",
]

[project.optional-dependencies]
opencv = ["opencv-python"]

[project.urls]
Homepage = "https://github.com/pekat-vision/pekat-vision-sdk-python"
Documentation = "https://pekat-vision.github.io/pekat-vision-sdk-python/"
Repository = "https://github.com/pekat-vision/pekat-vision-sdk-python.git"
Changelog = "https://github.com/pekat-vision/pekat-vision-sdk-python/blob/master/CHANGELOG.md"

[tool.hatch.version]
path = "src/PekatVisionSDK/__about__.py"

[tool.hatch.build.targets.sdist]
packages = ["src/PekatVisionSDK"]

[tool.hatch.build.targets.wheel]
packages = ["src/PekatVisionSDK"]

[tool.hatch.envs.test]
dependencies = [
    "pytest~=9.0",
    "requests~=2.32",
    "numpy~=2.2",
    "packaging~=26.0",
    "typing-extensions~=4.15",
    "psutil~=7.2",
]

[tool.hatch.envs.test.scripts]
test = "pytest {args:test}"

[tool.hatch.envs.dev]
description = "Full development environment."
type = "virtual"
path = ".venv"
python = "3.10"
dependencies = [
    "requests~=2.32",
    "numpy~=2.2",
    "packaging~=26.0",
    "opencv-python~=4.13",
    "mkdocs>=1.6,<2.0",
    "mkdocs-material~=9.7",
    "mkdocstrings-python~=2.0",
    "black~=26.3",
    "ruff~=0.15",
    "mypy~=1.19",
    "psutil~=7.2",
    "rich~=14.3",
    "typing-extensions~=4.15",
]

[tool.hatch.envs.docs]
detached = true
dependencies = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material~=9.7",
    "mkdocstrings-python~=2.0",
    "black~=26.3",
]

[tool.hatch.envs.docs.scripts]
serve = "mkdocs serve"
build = "mkdocs build"
deploy = "mkdocs gh-deploy --strict"

[tool.ruff]
target-version = "py310"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D105", "D107", "E501"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
